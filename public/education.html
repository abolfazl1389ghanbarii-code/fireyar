const root=document.querySelector("#lesson");const esc=s=>String(s??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));(async()=>{try{const r=await fetch("/api/public");if(!r.ok)throw Error();const d=await r.json();const id=Number(new URLSearchParams(location.search).get("id"));const x=(d.education||[]).find(q=>q.id===id);if(!x)throw Error();let blocks=[];try{blocks=JSON.parse(x.body||"[]")}catch{}let imageNo=0;const body=blocks.map(b=>{if(b.type==="image"){const n=imageNo++;return '<div class="lessonBlockPublic"><img src="/api/education-image?id='+x.id+'&n='+n+'" alt="'+esc(x.title)+'" loading="lazy"></div>'}return '<div class="lessonBlockPublic"><p>'+esc(b.content).replace(/\n/g,"<br>")+'</p></div>'}).join("");root.innerHTML=(x.image?'<img class="lessonCover" src="'+esc(x.image)+'" alt="'+esc(x.title)+'">':"")+'<h1 class="lessonTitle">'+esc(x.title)+'</h1>'+(x.meta?'<p class="lessonSummary">'+esc(x.meta)+'</p>':"")+(body||'<p>محتوای این آموزش هنوز تکمیل نشده است.</p>');document.title=x.title+" | آموزش آتش افرا";const desc=document.querySelector('meta[name="description"]');if(desc&&x.meta)desc.content=x.meta}catch(e){root.innerHTML='<h1>آموزش پیدا نشد</h1><p>ممکن است این آموزش حذف شده باشد یا هنوز منتشر نشده باشد.</p><a href="/#education">بازگشت به آموزش‌ها</a>'}})();
</script></main></body></html>
