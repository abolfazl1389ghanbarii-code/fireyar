<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>جزئیات پروژه | آتش افرا</title><link rel="stylesheet" href="/css/style.css"><style>
.detailWrap{max-width:980px;margin:48px auto;padding:0 20px}.detailBack{display:inline-block;color:#ef6b55;margin-bottom:22px;text-decoration:none}.detailPanel{background:#111c2d;border:1px solid #26364d;border-radius:20px;overflow:hidden;color:#eef3fa}.detailHero{width:100%;max-height:480px;object-fit:cover;display:block}.detailBody{padding:clamp(20px,5vw,42px)}.detailBody h1{margin:0 0 12px;font-size:clamp(1.6rem,4vw,2.5rem)}.detailMeta{color:#9eafc5;margin-bottom:22px}.detailText{white-space:pre-wrap;line-height:2;color:#d9e2ef}.gallery{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 0 18px;direction:ltr}.gallery img{flex:0 0 min(82%,620px);width:min(82%,620px);height:clamp(210px,55vw,390px);object-fit:cover;border-radius:14px;scroll-snap-align:center}.gallery:empty{display:none}.detailError{padding:30px;text-align:center}.detailLoading{color:#d9e2ef;padding:60px;text-align:center}@media(max-width:600px){.detailWrap{margin:24px auto}.detailBody{padding:20px}}
</style></head><body><main class="detailWrap"><a class="detailBack" href="/#projects">← بازگشت به پروژه‌ها</a><article id="project" class="detailPanel"><div class="detailLoading">در حال دریافت اطلاعات پروژه…</div></article></main><script>
'use strict';const root=document.getElementById('project'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id||!/^[0-9]+$/.test(id))throw Error('شناسه پروژه معتبر نیست.');const r=await fetch('/api/public',{headers:{accept:'application/json'}});if(!r.ok)throw Error('دریافت اطلاعات ناموفق بود.');const d=await r.json(),x=(d.projects||[]).find(p=>String(p.id)===id);if(!x)throw Error('پروژه پیدا نشد یا منتشر نشده است.');const imgs=Array.isArray(x.images)&&x.images.length?x.images:(x.image?[x.image]:[]);document.title=x.title+' | آتش افرا';root.innerHTML=(imgs.length?'<div class="gallery">'+imgs.map((src,i)=>'<img src="'+esc(src)+'" alt="'+esc(x.title)+' — تصویر '+(i+1)+'" loading="'+(i?'lazy':'eager')+'">').join('')+'</div>':'')+'<div class="detailBody"><h1>'+esc(x.title)+'</h1><div class="detailMeta">'+esc(x.meta||'پروژه آتش افرا')+'</div><div class="detailText">'+esc(x.body||'توضیحات این پروژه ثبت نشده است.')+'</div></div>'; }catch(e){root.innerHTML='<div class="detailError"><h1>پروژه در دسترس نیست</h1><p>'+esc(e.message)+'</p><a href="/#projects">بازگشت به پروژه‌ها</a></div>';}})();
</script></body></html>
